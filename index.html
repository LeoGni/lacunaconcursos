  <style>
    :root{
      --bg:#04101b;
      --bg2:#071827;
      --text:#fff;
      --muted:#aebfd0;
      --radius:16px;
      --max:520px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% -10%,rgba(20,126,255,.12),transparent 32%),
        linear-gradient(180deg,#020910 0%,var(--bg) 48%,var(--bg2) 100%);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .page{
      width:min(calc(100% - 20px),var(--max));
      margin:0 auto;
      padding:14px 0 max(18px,env(safe-area-inset-bottom));
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin-bottom:12px;
    }

    .brand-mark{
      width:32px;
      height:32px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:1000;
      font-size:15px;
      background:linear-gradient(145deg,#36a7ff,#0053bf);
      box-shadow:0 0 18px rgba(32,132,255,.34);
    }

    .brand-text{line-height:1.05}
    .brand-name{
      font-size:12px;
      font-weight:900;
      letter-spacing:.3px;
      text-transform:uppercase;
    }
    .brand-handle{
      margin-top:3px;
      font-size:10px;
      color:var(--muted);
      font-weight:650;
    }

    .hero{
      text-align:center;
      margin:0 0 12px;
    }

    h1{
      margin:0;
      font-size:clamp(27px,7vw,36px);
      line-height:1;
      letter-spacing:-1.25px;
      font-weight:950;
    }

    .hero p{
      margin:7px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .grid{
      display:grid;
      gap:8px;
    }

    .contest-card{
      position:relative;
      display:block;
      width:100%;
      aspect-ratio:3.65/1;
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background:#091522;
      box-shadow:0 8px 20px rgba(0,0,0,.22);
      transform:translateZ(0);
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
    }

    .contest-card:active{transform:scale(.987)}

    .contest-card img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
    }

    .contest-card:not(.pending)::after{
      content:"›";
      position:absolute;
      right:7px;
      bottom:7px;
      width:27px;
      height:27px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:18px;
      font-weight:900;
      line-height:1;
      background:rgba(2,8,15,.67);
      border:1px solid rgba(255,255,255,.22);
      backdrop-filter:blur(6px);
      box-shadow:0 4px 12px rgba(0,0,0,.25);
    }

    .pending{
      cursor:default;
    }

    .pending::after{
      content:"EM BREVE";
      position:absolute;
      right:7px;
      bottom:7px;
      padding:5px 8px;
      border-radius:999px;
      color:#fff;
      font-size:8px;
      font-weight:900;
      letter-spacing:.5px;
      background:rgba(2,8,15,.70);
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter:blur(6px);
    }

    .footer{
      padding:12px 4px 0;
      text-align:center;
      color:#6f879d;
      font-size:9px;
    }

    @media (hover:hover){
      .contest-card:not(.pending):hover{
        transform:translateY(-2px);
        border-color:rgba(81,177,255,.45);
        box-shadow:0 12px 28px rgba(0,0,0,.28);
      }
    }

    @media (max-height:720px){
      .page{padding-top:10px}
      .brand{margin-bottom:8px}
      .hero{margin-bottom:9px}
      h1{font-size:26px}
      .hero p{margin-top:5px;font-size:11px}
      .grid{gap:7px}
      .contest-card{aspect-ratio:3.9/1}
      .footer{padding-top:9px}
    }

    @media (min-width:720px){
      :root{--max:640px}
      .page{padding-top:20px}
      .contest-card{aspect-ratio:3.35/1}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
